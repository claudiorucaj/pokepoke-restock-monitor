name: Monitor (cloud, riserva)

# Copertura per quando il PC e spento. Gira su runner GitHub, che hanno IP
# datacenter: Amazon li blocca molto piu spesso, quindi questa e una rete di
# sicurezza, non la fonte principale.
#
# Prima di ogni giro chiede a GitHub se il workflow del PC ha un'esecuzione in
# corso. Se si, salta il giro senza nemmeno contattare Amazon: due controllori
# insieme raddoppierebbero le richieste e quindi i blocchi.
#
# Guarda le esecuzioni e non i runner perche leggere i runner richiederebbe un
# token con permesso Administration, mentre per le esecuzioni basta il token
# automatico di Actions con actions: read. Un secret in meno da gestire.

# Il workflow si riavvia da solo: appena il parser e verificato, prenota il
# run successivo con workflow_dispatch. Il gruppo di concurrency lo tiene in
# attesa e lo fa partire appena questo finisce, quindi la copertura e continua
# a meno del minuto di preparazione del job. Il cron di GitHub qui sotto resta
# solo come riserva per riagganciare la catena se si spezza: da solo non basta,
# il 25/09 su 24 avvii orari previsti ne ha fatti partire 5, lasciando
# scoperto l'80% della giornata.
#
# Il run successivo lo lancia il token automatico di Actions. Gli eventi
# generati da quel token di norma non avviano workflow, ma workflow_dispatch
# fa eccezione: per questo non serve nessun token personale.

on:
  schedule:
    # Sfasato di 4 minuti rispetto al workflow del PC di proposito. Partendo
    # entrambi a :00, il runner cloud (che si avvia in pochi secondi) vedrebbe
    # il job del PC ancora in coda invece che in corso, si crederebbe scoperto
    # e monitorerebbe in doppio per qualche minuto.
    - cron: "4 * * * *"
  workflow_dispatch:

permissions:
  # write serve solo a prenotare il run successivo.
  actions: write
  contents: read

concurrency:
  group: monitor-cloud
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Verifica il parser prima di fidarsi
        run: python monitor.py --selftest

      # Dopo il selftest e non prima: con il parser rotto la catena si ferma
      # invece di rigirare a vuoto ogni minuto, e a riagganciarla ci pensa il
      # cron orario una volta sistemato il codice.
      - name: Prenota il run successivo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run watch-cloud.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

      - name: Recupera lo stato del giro precedente
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: stato-${{ github.run_id }}
          restore-keys: stato-

      - name: Monitoraggio (cede il passo al PC)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python monitor.py --durata-min 55 --cede-al-pc

      - name: Salva lo stato per il giro successivo
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: stato-${{ github.run_id }}
