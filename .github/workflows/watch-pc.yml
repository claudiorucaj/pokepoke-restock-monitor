name: Monitor (PC)

# Fonte primaria. Gira sul runner self-hosted installato sul PC di casa:
# l'IP residenziale e quello che Amazon blocca di meno.
#
# Il cron di GitHub non scende sotto i 5 minuti, quindi la frequenza di 60
# secondi la fa il ciclo interno a monitor.py: il job vive 55 minuti e il
# cron lo riavvia ogni ora.
#
# Nessun actions/setup-python qui, a differenza del workflow cloud: sul PC
# Python e gia installato, e setup-python proverebbe a installarlo con
# InstallAllUsers=1, che richiede privilegi di amministratore che il runner
# non ha. Il job resterebbe appeso a quel passaggio, come e successo.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: monitor-pc
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: [self-hosted, pokepoke]
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Python disponibile sul PC
        run: python --version

      - name: Installa dipendenze
        run: python -m pip install --quiet -r requirements.txt

      - name: Verifica il parser prima di fidarsi
        run: python monitor.py --selftest

      - name: Recupera lo stato del giro precedente
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: stato-${{ github.run_id }}
          restore-keys: stato-

      - name: Monitoraggio
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python monitor.py --durata-min 55

      - name: Salva lo stato per il giro successivo
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: stato-${{ github.run_id }}
